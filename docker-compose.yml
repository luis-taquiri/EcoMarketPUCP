name: ecomarket-pucp
services:
  ecomarket:
    build: .
    image: ecomarket-pucp:latest
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${HOST_PORT:-3200}:3000"
    environment:
      DATABASE_URL: "file:/app/data/prod.db"
      UPLOAD_DIR: "/app/uploads"
      APP_URL: "${APP_URL:-http://localhost:3200}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      SEED_DEMO: "${SEED_DEMO:-false}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    volumes:
      - ecomarket_data:/app/data
      - ecomarket_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
volumes:
  ecomarket_data:
  ecomarket_uploads:
